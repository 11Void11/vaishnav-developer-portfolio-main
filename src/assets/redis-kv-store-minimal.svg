<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" fill="none">
  <rect width="960" height="600" rx="18" fill="#0B151B"/>
  <rect x="1" y="1" width="958" height="598" rx="17" stroke="#263740"/>
  <!-- editor / terminal window -->
  <rect x="54" y="55" width="852" height="490" rx="10" fill="#101F27" stroke="#344750"/>
  <path d="M54 95H906" stroke="#344750"/>
  <circle cx="78" cy="75" r="5" fill="#F0645A"/>
  <circle cx="96" cy="75" r="5" fill="#D8A34A"/>
  <circle cx="114" cy="75" r="5" fill="#7C9A85"/>
  <text x="480" y="80" text-anchor="middle" fill="#91A3AA" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1.4">KV STORE · LOCAL INSTANCE</text>

  <!-- left terminal -->
  <text x="88" y="137" fill="#8498A1" font-family="Consolas,monospace" font-size="12">COMMANDS</text>
  <text x="88" y="181" fill="#DCE6E9" font-family="Consolas,monospace" font-size="17"><tspan fill="#B7D77A">redis&gt;</tspan><tspan> SET user:42 "Vaishnav"</tspan></text>
  <text x="88" y="210" fill="#8498A1" font-family="Consolas,monospace" font-size="14">OK</text>
  <text x="88" y="260" fill="#DCE6E9" font-family="Consolas,monospace" font-size="17"><tspan fill="#B7D77A">redis&gt;</tspan><tspan> GET user:42</tspan></text>
  <text x="88" y="289" fill="#E6B36A" font-family="Consolas,monospace" font-size="14">"Vaishnav"</text>
  <text x="88" y="339" fill="#DCE6E9" font-family="Consolas,monospace" font-size="17"><tspan fill="#B7D77A">redis&gt;</tspan><tspan> SET session:7 active</tspan></text>
  <text x="88" y="368" fill="#8498A1" font-family="Consolas,monospace" font-size="14">OK</text>
  <path d="M88 410H442" stroke="#344750"/>
  <text x="88" y="445" fill="#8498A1" font-family="Consolas,monospace" font-size="12">IN-MEMORY ENGINE</text>
  <text x="88" y="482" fill="#E2EAED" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">Fast key-value access</text>
  <text x="88" y="508" fill="#8498A1" font-family="Inter,Arial,sans-serif" font-size="13">C++ · Hash table · O(1) average lookup</text>

  <!-- divider -->
  <path d="M485 118V515" stroke="#344750"/>

  <!-- right data view -->
  <text x="528" y="137" fill="#8498A1" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1.2">MEMORY MAP</text>
  <text x="528" y="178" fill="#DCE6E9" font-family="Consolas,monospace" font-size="13">HASH TABLE</text>
  <rect x="528" y="197" width="340" height="54" rx="5" fill="#172A33" stroke="#3B515B"/>
  <rect x="528" y="197" width="4" height="54" rx="2" fill="#D3A35E"/>
  <text x="548" y="220" fill="#B5C5CB" font-family="Consolas,monospace" font-size="13">user:42</text>
  <text x="848" y="220" text-anchor="end" fill="#E4EBED" font-family="Consolas,monospace" font-size="13">"Vaishnav"</text>
  <text x="548" y="239" fill="#70858E" font-family="Consolas,monospace" font-size="10">0x01A4</text>
  <rect x="528" y="261" width="340" height="54" rx="5" fill="#172A33" stroke="#3B515B"/>
  <rect x="528" y="261" width="4" height="54" rx="2" fill="#D3A35E"/>
  <text x="548" y="284" fill="#B5C5CB" font-family="Consolas,monospace" font-size="13">session:7</text>
  <text x="848" y="284" text-anchor="end" fill="#E4EBED" font-family="Consolas,monospace" font-size="13">active</text>
  <text x="548" y="303" fill="#70858E" font-family="Consolas,monospace" font-size="10">0x02F8</text>
  <rect x="528" y="325" width="340" height="54" rx="5" fill="#172A33" stroke="#3B515B"/>
  <rect x="528" y="325" width="4" height="54" rx="2" fill="#D3A35E"/>
  <text x="548" y="348" fill="#B5C5CB" font-family="Consolas,monospace" font-size="13">cache:home</text>
  <text x="848" y="348" text-anchor="end" fill="#E4EBED" font-family="Consolas,monospace" font-size="13">/index</text>
  <text x="548" y="367" fill="#70858E" font-family="Consolas,monospace" font-size="10">0x03C2</text>

  <!-- understated metrics -->
  <path d="M528 410H868" stroke="#344750"/>
  <text x="528" y="444" fill="#8498A1" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="1">AVERAGE OPERATION</text>
  <text x="528" y="485" fill="#E5B16A" font-family="Consolas,monospace" font-size="34" font-weight="600">O(1)</text>
  <text x="650" y="483" fill="#8498A1" font-family="Inter,Arial,sans-serif" font-size="13">GET  /  SET</text>
  <rect x="528" y="505" width="340" height="3" rx="1.5" fill="#263B44"/>
  <rect x="528" y="505" width="246" height="3" rx="1.5" fill="#B7D77A"/>
</svg>